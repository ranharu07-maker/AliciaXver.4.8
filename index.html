<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

}


body {

    background: #080808;

    color: #f2f2f2;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;

    user-select: none;

}

:root {

    --ui-opacity: 1;

    --background: rgb(8 8 8 / var(--ui-opacity));

    --header: rgb(11 11 11 / var(--ui-opacity));

    --sidebar: rgb(13 13 13 / var(--ui-opacity));

    --panel: rgb(17 17 17 / var(--ui-opacity));

    --panel-hover: rgb(24 24 24 / var(--ui-opacity));

    --border: #242424;

    --border-light: #303030;

    --text: #f2f2f2;

    --text-sub: #888;

    --text-muted: #5d5d5d;

    --id-color: #89a5ff;

    --favorite: #f2c94c;

    --radius: 8px;

}

:root{
    --theme-accent:#8b5cf6;
    --theme-accent-rgb:139,92,246;
    --theme-accent-soft:rgba(139,92,246,.16);
}
body.theme-red{--theme-accent:#ef4444;--theme-accent-rgb:239,68,68;--theme-accent-soft:rgba(239,68,68,.16)}
body.theme-green{--theme-accent:#22c55e;--theme-accent-rgb:34,197,94;--theme-accent-soft:rgba(34,197,94,.16)}
body.theme-pink{--theme-accent:#ec4899;--theme-accent-rgb:236,72,153;--theme-accent-soft:rgba(236,72,153,.16)}
body.theme-blue{--theme-accent:#3b82f6;--theme-accent-rgb:59,130,246;--theme-accent-soft:rgba(59,130,246,.16)}
body.theme-purple{--theme-accent:#8b5cf6;--theme-accent-rgb:139,92,246;--theme-accent-soft:rgba(139,92,246,.16)}
body.theme-white{--theme-accent:#f5f5f5;--theme-accent-rgb:245,245,245;--theme-accent-soft:rgba(245,245,245,.12)}
body.theme-black{--theme-accent:#555;--theme-accent-rgb:85,85,85;--theme-accent-soft:rgba(85,85,85,.16)}
body.theme-orange{--theme-accent:#f97316;--theme-accent-rgb:249,115,22;--theme-accent-soft:rgba(249,115,22,.16)}
body.theme-yellow{--theme-accent:#eab308;--theme-accent-rgb:234,179,8;--theme-accent-soft:rgba(234,179,8,.16)}
body.theme-yellowgreen{--theme-accent:#84cc16;--theme-accent-rgb:132,204,22;--theme-accent-soft:rgba(132,204,22,.16)}

/* Sidebar */
body[class*="theme-"] .category:hover{
    background:var(--theme-accent-soft);
    border-color:rgba(var(--theme-accent-rgb),.35);
}
body[class*="theme-"] .category.active{
    /* 選択中はアクセント色を薄く透過表示 */
    background:rgba(var(--theme-accent-rgb),.22) !important;
    color:#fff !important;
    box-shadow:0 0 0 1px rgba(var(--theme-accent-rgb),.3),0 4px 14px rgba(var(--theme-accent-rgb),.16);
}

/* UI controls / focus */
body[class*="theme-"] .action-button:hover,
body[class*="theme-"] .video-action:hover,
body[class*="theme-"] .main-photo-button:hover{
    border-color:var(--theme-accent);
    color:var(--theme-accent);
}
body[class*="theme-"] .search-box:focus,
body[class*="theme-"] input:focus,
body[class*="theme-"] select:focus,
body[class*="theme-"] textarea:focus{
    border-color:var(--theme-accent) !important;
    box-shadow:0 0 0 2px var(--theme-accent-soft);
}
body[class*="theme-"] select{
    accent-color:var(--theme-accent);
}
body[class*="theme-"] .slider-container input{
    accent-color:var(--theme-accent);
}
body[class*="theme-"] .toggle.active{
    background:var(--theme-accent);
}
body[class*="theme-"] .toggle.active::after{
    background:#fff;
}
body.theme-white .toggle.active::after{background:#111}

.app {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    background: var(--background);

}

.header {

    height: 58px;
    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: var(--header);

    border-bottom:
        1px solid var(--border);

}


.header-left {

    display: flex;
    align-items: center;

}


.logo {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: 1.8px;

}


.version {

    margin-left: 9px;

    color: var(--text-muted);

    font-size: 10px;

}


.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #666;
    font-size: 11px;
}
.header-x-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    color: #eee;
    font-family: Arial, sans-serif;
    font-size: 19px;
    line-height: 1;
    text-decoration: none;
    opacity: .82;
    transition: opacity .15s, transform .15s;
}
.header-x-link:hover {
    opacity: 1;
    transform: scale(1.08);
}

.body {

    flex: 1;

    min-height: 0;

    display: flex;

}

.sidebar {

    width: 190px;
    min-width: 190px;

    padding: 14px 10px;

    background: var(--sidebar);

    border-right:
        1px solid var(--border);

    overflow-y: auto;

}


.sidebar-title {

    padding: 7px 10px;

    margin-bottom: 5px;

    color: #555;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.5px;

}


.category {

    width: 100%;

    border: 0;
    outline: none;

    padding: 12px;

    margin-bottom: 3px;

    border-radius: 6px;

    background: transparent;

    color: #888;

    text-align: left;

    font-size: 13px;

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease;

}


.category:hover {

    background: #171717;

    color: #ddd;

}


.category.active {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: #1d1d1d;
    color: #fff;
}

/* Theme色の光が左上→右下、右下→左上へゆっくり往復 */
body[class*="theme-"] .category.active::after {
    content: "";
    position: absolute;
    inset: -120%;
    pointer-events: none;
    z-index: -1;
    background: linear-gradient(135deg,
        transparent 44%,
        rgba(var(--theme-accent-rgb), 0) 46%,
        rgba(var(--theme-accent-rgb), .035) 48%,
        rgba(255,255,255,.12) 50%,
        rgba(var(--theme-accent-rgb), .035) 52%,
        rgba(var(--theme-accent-rgb), 0) 54%,
        transparent 56%);
    transform: translate(-35%, -35%);
    animation: themeLightSweep 18s ease-in-out infinite alternate;
}

@keyframes themeLightSweep {
    0% { transform: translate(-35%, -35%); }
    100% { transform: translate(35%, 35%); }
}

@media (prefers-reduced-motion: reduce) {
    body[class*="theme-"] .category.active::after { animation: none; }
}

/* AnimationsがOFFのときはテーマ光そのものを非表示 */
body:not(.animations-enabled) .category.active::after {
    display: none !important;
    animation: none !important;
}

.content {

    flex: 1;

    min-width: 0;
    min-height: 0;

    overflow-y: auto;

    padding: 24px;

    background-color: var(--background);
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;

}


.content-inner {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

}

/* CONTENT BACKGROUND */
.content {
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
}

.content-inner {
    position: relative;
    z-index: 1;
}

.page-title {

    font-size: 23px;

    font-weight: 700;

    margin-bottom: 5px;

}


.page-description {

    color: var(--text-sub);

    font-size: 12px;

    margin-bottom: 20px;

}

.search-box {

    width: 100%;

    height: 42px;

    margin-bottom: 15px;

    padding: 0 13px;

    border:
        1px solid var(--border-light);

    border-radius: 7px;

    outline: none;

    background: #0d0d0d;

    color: #eee;

    font-size: 13px;

    appearance: none;

    -webkit-appearance: none;

}


.search-box::placeholder {

    color: #555;

}


.search-box:focus {

    border-color: #444;

}

.section {

    margin-bottom: 18px;

}


.section-title {

    margin:
        0 0 7px 4px;

    color: #666;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.4px;

}


.card {

    overflow: hidden;

    background: var(--panel);

    border:
        1px solid var(--border);

    border-radius: var(--radius);

}

.id-item,
.skin-item,
.item-item,
.favorite-item {

    min-height: 57px;

    padding: 11px 14px;

    display: flex;

    align-items: center;

    gap: 10px;

    border-bottom:
        1px solid #1d1d1d;

    transition:
        background .12s ease,
        transform .08s ease;

}


.id-item:last-child,
.skin-item:last-child,
.item-item:last-child,
.favorite-item:last-child {

    border-bottom: 0;

}


.id-item:hover,
.skin-item:hover,
.item-item:hover,
.favorite-item:hover {

    background:
        var(--panel-hover);

}


.id-item:active,
.skin-item:active,
.item-item:active,
.favorite-item:active {

    background: #202020;

}

.id-main,
.skin-main,
.item-main,
.favorite-main {

    min-width: 0;

    flex: 1;

}


.id-line,
.skin-line,
.item-line,
.favorite-line {

    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 5px;

    line-height: 1.5;

}


.id-value,
.skin-value,
.item-value,
.favorite-value {

    color: var(--id-color);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 13px;

    font-weight: 600;

    word-break: break-all;

}


.id-name,
.skin-name,
.item-name,
.favorite-name {

    color: #d0d0d0;

    font-size: 13px;

    word-break: break-word;

}


.id-no {

    color: #666;

    font-size: 11px;

    white-space: nowrap;

}

.player-item {

    min-height: 57px;

    padding: 11px 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    border-bottom:
        1px solid #1d1d1d;

    cursor: pointer;

    transition:
        background .12s ease,
        transform .08s ease;

}


.player-item:last-child {

    border-bottom: 0;

}


.player-item:hover {

    background:
        var(--panel-hover);

}


.player-item:active {

    background: #202020;

    transform:
        scale(.995);

}


.player-name {

    min-width: 0;

    flex: 1;

    color: #e5e5e5;

    font-size: 13px;

    word-break: break-word;

}

.copy-label {

    flex-shrink: 0;

    min-width: 48px;

    color: #555;

    font-size: 9px;

    letter-spacing: 1px;

    text-align: right;

}

.favorite-star {

    flex-shrink: 0;

    width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 0;
    outline: none;

    border-radius: 50%;

    background: transparent;

    color: #555;

    font-size: 21px;

    line-height: 1;

    cursor: pointer;

    transition:
        color .15s ease,
        background .15s ease,
        transform .12s ease;

}


.favorite-star:hover {

    background: #222;

    color: #999;

}


.favorite-star.active {

    color: var(--favorite);

}


.favorite-star.active:hover {

    color: #ffe27a;

}


.favorite-star:active {

    transform:
        scale(.82);

}

.favorite-type {

    flex-shrink: 0;

    min-width: 48px;

    color: #555;

    font-size: 9px;

    text-align: right;

    letter-spacing: .8px;

}

.favorite-empty {

    padding: 45px 20px;

    color: #555;

    text-align: center;

    font-size: 12px;

}


.favorite-empty-star {

    display: block;

    margin-bottom: 8px;

    color: #444;

    font-size: 25px;

}

.favorite-stat-label{color:#666;font-size:9px;font-weight:700;letter-spacing:1px}.favorite-stat-value{margin-top:4px;color:#eee;font-size:18px;font-weight:700}

@media (max-width:600px){.main-count-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.main-count-card{padding:14px 8px}.main-count-value{font-size:21px}.favorite-summary{gap:6px}.favorite-stat{padding:9px 8px}.favorite-stat-label{font-size:8px}.favorite-stat-value{font-size:16px}.history-item{min-height:55px;padding:10px 9px}.history-value,.history-name{font-size:11px}.history-type{min-width:35px;font-size:7px}}

function parseRawData(data) {

    return data
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {

            const match =
                line.match(
                    /^(.+?)\((.*?)\)No\.(.+)$/
                );


            if (!match) {

                return {
                    id: line,
                    name: "",
                    no: ""
                };

            }


            return {

                id: match[1].trim(),

                name: match[2].trim(),

                no: match[3].trim()

            };

        });

}

        return {
            playerIDs: Array.isArray(parsed.playerIDs) ? parsed.playerIDs : [],

    } catch (error) {

}

const VIDEO_DB_NAME = "modmenu_savevideo_v1";
const VIDEO_DB_STORE = "videos";
const VIDEO_LIMIT = 50;

function openVideoDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(VIDEO_DB_NAME, 1);
        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(VIDEO_DB_STORE)) {
                db.createObjectStore(VIDEO_DB_STORE, { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
    });
}

function videoDBTransaction(tx) {
    return new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error || new Error("IndexedDB transaction failed"));
        tx.onabort = () => reject(tx.error || new Error("IndexedDB transaction aborted"));
    });
}

async function getSavedVideos() {
    const db = await openVideoDB();
    try {
        const tx = db.transaction(VIDEO_DB_STORE, "readonly");
        const request = tx.objectStore(VIDEO_DB_STORE).getAll();
        return await new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error || new Error("Video read failed"));
        });
    } finally {
        db.close();
    }
}

async function getSavedVideo(id) {
    const db = await openVideoDB();
    try {
        const tx = db.transaction(VIDEO_DB_STORE, "readonly");
        const request = tx.objectStore(VIDEO_DB_STORE).get(id);
        return await new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error || new Error("Video read failed"));
        });
    } finally {
        db.close();
    }
}

async function addSavedVideo(title, file) {
    const videos = await getSavedVideos();
    if (videos.length >= VIDEO_LIMIT) return false;

    const db = await openVideoDB();
    try {
        const tx = db.transaction(VIDEO_DB_STORE, "readwrite");
        tx.objectStore(VIDEO_DB_STORE).add({
            title: String(title || "").trim(),
            name: file.name || "video",
            type: file.type || "video/mp4",
            size: file.size || 0,
            time: Date.now(),
            blob: file
        });
        await videoDBTransaction(tx);
        return true;
    } finally {
        db.close();
    }
}

async function deleteSavedVideo(id) {
    const db = await openVideoDB();
    try {
        const tx = db.transaction(VIDEO_DB_STORE, "readwrite");
        tx.objectStore(VIDEO_DB_STORE).delete(id);
        await videoDBTransaction(tx);
        return true;
    } finally {
        db.close();
    }
}

function formatVideoSize(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "";
    const units = ["B", "KB", "MB", "GB"];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
    }
    return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
}

async function renderVideoList() {
    const card = document.getElementById("saveVideoListCard");
    if (!card) return;

    try {
        const videos = (await getSavedVideos()).sort((a, b) => (b.time || 0) - (a.time || 0));
        if (!videos.length) {
            card.innerHTML = `<div class="video-empty">保存された動画はまだありません</div>`;
            return;
        }

        card.innerHTML = videos.map(video => `
            <div class="video-entry" data-video-id="${video.id}">
                <div class="video-entry-title">${escapeHTML(video.title || video.name || "Video")}</div>
                <video class="video-player" controls playsinline autoplay loop preload="metadata"></video>
                <div class="video-meta">${escapeHTML(video.name || "")}${video.size ? ` • ${formatVideoSize(video.size)}` : ""}</div>
                <div class="video-entry-actions">
                    <button class="video-action video-pip" type="button">ピクチャーインピクチャー</button>
                    <button class="video-action video-download" type="button">動画ダウンロード</button>
                    <button class="video-action video-delete" type="button">削除</button>
                </div>
            </div>
        `).join("");

        videos.forEach(video => {
            const entry = card.querySelector(`.video-entry[data-video-id="${video.id}"]`);
            if (!entry) return;
            const player = entry.querySelector(".video-player");
            const url = URL.createObjectURL(video.blob);
            player.src = url;
            player.setAttribute("playsinline", "");
            player.setAttribute("webkit-playsinline", "");
            player.setAttribute("autoplay", "");
            player.setAttribute("loop", "");
            player.preload = "auto";
            player.addEventListener("emptied", () => URL.revokeObjectURL(url), { once: true });

            // バックグラウンド再生 / ロック画面メディア操作に対応
            // 対応ブラウザでは、再生中にアプリをバックグラウンドへ移しても
            // Media Session 経由で再生状態/タイトル/操作を維持します。
            const setMediaSession = () => {
                if (!("mediaSession" in navigator)) return;
                try {
                    if ("MediaMetadata" in window) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: video.title || video.name || "Video",
                            artist: "SaveVideo",
                            album: "ModMenu"
                        });
                    }
                    const actions = {
                        play: () => player.play().catch(() => {}),
                        pause: () => player.pause(),
                        seekbackward: () => { player.currentTime = Math.max(0, player.currentTime - 10); },
                        seekforward: () => { player.currentTime = Math.min(player.duration || Infinity, player.currentTime + 10); },
                        previoustrack: () => { player.currentTime = 0; },
                        nexttrack: () => { player.currentTime = 0; player.play().catch(() => {}); }
                    };
                    Object.entries(actions).forEach(([action, handler]) => {
                        try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
                    });
                } catch (error) {
                    console.log("Media Session setup error:", error);
                }
            };

            player.addEventListener("play", setMediaSession);
            player.addEventListener("playing", setMediaSession);
            player.addEventListener("pause", () => {
                if ("mediaSession" in navigator) {
                    try { navigator.mediaSession.playbackState = "paused"; } catch (_) {}
                }
            });
            player.addEventListener("playing", () => {
                if ("mediaSession" in navigator) {
                    try { navigator.mediaSession.playbackState = "playing"; } catch (_) {}
                }
            });

            entry.querySelector(".video-pip").addEventListener("click", async () => {
                try {
                    if (document.pictureInPictureElement === player) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled && player.requestPictureInPicture) {
                        await player.requestPictureInPicture();
                    } else {
                        showToast("ピクチャーインピクチャーに対応していません");
                    }
                } catch (error) {
                    console.log("PiP error:", error);
                    showToast("ピクチャーインピクチャーを開始できませんでした");
                }
            });

            entry.querySelector(".video-download").addEventListener("click", async () => {
                try {
                    // IndexedDBのBlobから新しいBlob URLを作り直してダウンロードする
                    const saved = await getSavedVideo(video.id);
                    if (!saved || !saved.blob) {
                        showToast("保存された動画が見つかりません");
                        return;
                    }

                    const blob = saved.blob instanceof Blob
                        ? saved.blob
                        : new Blob([saved.blob], { type: saved.type || "video/mp4" });

                    let filename = saved.name || `${saved.title || "video"}.mp4`;
                    filename = filename.replace(/[\\/:*?"<>|]/g, "_");

                    const downloadUrl = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = downloadUrl;
                    link.download = filename;
                    link.style.display = "none";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    // 一部ブラウザでは即時解放すると保存が失敗するため少し待つ
                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 10000);
                } catch (error) {
                    console.log("Video download error:", error);
                    showToast("動画をダウンロードできませんでした");
                }
            });

            entry.querySelector(".video-delete").addEventListener("click", async () => {
                if (!confirm(`「${video.title || video.name}」を削除しますか？`)) return;
                try {
                    await deleteSavedVideo(video.id);
                    renderVideoList();
                    showToast("動画を削除しました");
                } catch (error) {
                    console.log("Video delete error:", error);
                    showToast("動画を削除できませんでした");
                }
            });
        });
    } catch (error) {
        console.log("Video list error:", error);
        card.innerHTML = `<div class="video-empty">動画を読み込めませんでした</div>`;
    }
}

        tx.objectStore(IMAGE_DB_STORE).delete(id);
        await imageDBTransaction(tx);
        return true;
    } finally {
        db.close();
    }
}

function formatImageSize(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "";
    const units = ["B", "KB", "MB", "GB"];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
    }
    return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
}

async function renderImageList() {
    const card = document.getElementById("saveImageListCard");
    if (!card) return;

    try {
        const images = (await getSavedImages()).sort((a, b) => (b.time || 0) - (a.time || 0));
        if (!images.length) {
            card.innerHTML = `<div class="image-empty">保存された画像はまだありません</div>`;
            return;
        }

        card.innerHTML = images.map(image => `
            <div class="image-entry" data-image-id="${image.id}">
                <div class="image-entry-title">${escapeHTML(image.title || image.name || "Image")}</div>
                <img class="image-preview" alt="${escapeAttribute(image.title || image.name || "Image")}">
                <div class="image-meta">${escapeHTML(image.name || "")}${image.size ? ` • ${formatImageSize(image.size)}` : ""}</div>
                <div class="image-entry-actions">
                    <button class="image-action image-download" type="button">画像ダウンロード</button>
                    <button class="image-action image-delete" type="button">削除</button>
                </div>
            </div>
        `).join("");

        images.forEach(image => {
            const entry = card.querySelector(`.image-entry[data-image-id="${image.id}"]`);
            if (!entry) return;

            const preview = entry.querySelector(".image-preview");
            const blob = image.blob instanceof Blob
                ? image.blob
                : new Blob([image.blob], { type: image.type || "image/jpeg" });
            const url = URL.createObjectURL(blob);
            preview.src = url;
            preview.addEventListener("load", () => {
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, { once: true });
            preview.addEventListener("error", () => URL.revokeObjectURL(url), { once: true });

            entry.querySelector(".image-download").addEventListener("click", async () => {
                try {
                    const saved = await getSavedImage(image.id);
                    if (!saved || !saved.blob) {
                        showToast("保存された画像が見つかりません");
                        return;
                    }

                    const savedBlob = saved.blob instanceof Blob
                        ? saved.blob
                        : new Blob([saved.blob], { type: saved.type || "image/jpeg" });

                    let filename = saved.name || `${saved.title || "image"}.jpg`;
                    filename = filename.replace(/[\\/:*?"<>|]/g, "_");

                    const downloadUrl = URL.createObjectURL(savedBlob);
                    const link = document.createElement("a");
                    link.href = downloadUrl;
                    link.download = filename;
                    link.style.display = "none";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 10000);
                } catch (error) {
                    console.log("Image download error:", error);
                    showToast("画像をダウンロードできませんでした");
                }
            });

            entry.querySelector(".image-delete").addEventListener("click", async () => {
                if (!confirm(`「${image.title || image.name}」を削除しますか？`)) return;
                try {
                    await deleteSavedImage(image.id);
                    await renderImageList();
                    showToast("画像を削除しました");
                } catch (error) {
                    console.log("Image delete error:", error);
                    showToast("画像を削除できませんでした");
                }
            });
        });
    } catch (error) {
        console.log("Image list error:", error);
        card.innerHTML = `<div class="image-empty">画像を読み込めませんでした</div>`;
    }
}

function setupSaveVideoUrlDownload() {
    const fab = document.getElementById("saveVideoDownloadFab");
    const panel = document.getElementById("saveVideoDownloadPanel");
    const urlInput = document.getElementById("saveVideoDownloadUrl");
    const start = document.getElementById("saveVideoDownloadStart");
    const close = document.getElementById("saveVideoDownloadClose");
    if (!fab || !panel || !urlInput || !start) return;

    const hide = () => {
        panel.classList.remove("is-open");
        panel.setAttribute("aria-hidden", "true");
    };
    fab.addEventListener("click", event => {
        event.stopPropagation();
        const opening = !panel.classList.contains("is-open");
        panel.classList.toggle("is-open", opening);
        panel.setAttribute("aria-hidden", String(!opening));
        if (opening) { urlInput.focus(); urlInput.select(); }
    });
    panel.addEventListener("click", event => event.stopPropagation());
    close?.addEventListener("click", hide);

    start.addEventListener("click", async () => {
        const raw = urlInput.value.trim();
        let url;
        try { url = new URL(raw); } catch (_) { showToast("正しい動画URLを入力してください"); return; }
        if (!["http:", "https:"].includes(url.protocol)) { showToast("HTTPまたはHTTPSのURLを入力してください"); return; }

        start.disabled = true;
        const oldText = start.textContent;
        start.textContent = "取得中...";
        try {
            const response = await fetch(url.href, { mode: "cors", credentials: "omit" });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const type = (response.headers.get("content-type") || "").toLowerCase();
            if (!type.startsWith("video/") && !/\.(mp4|webm|mov|m4v|ogv)(?:$|[?#])/i.test(url.href)) {
                throw new Error("動画ファイルのURLではないようです");
            }
            const blob = await response.blob();
            if (!blob.size) throw new Error("空のファイルです");
            const extMatch = url.pathname.match(/\.(mp4|webm|mov|m4v|ogv)$/i);
            const ext = extMatch ? extMatch[1].toLowerCase() : (type.includes("webm") ? "webm" : type.includes("quicktime") ? "mov" : "mp4");
            const objectUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = objectUrl;
            a.download = "video." + ext;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
            showToast("動画のダウンロードを開始しました（元の画質）");
            hide();
        } catch (error) {
            console.warn("SaveVideo URL download error:", error);
            showToast("取得できませんでした。直接動画URLか、CORS制限をご確認ください");
        } finally {
            start.disabled = false;
            start.textContent = oldText;
        }
    });
}

function resizeImageForMainPhoto(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const image = new Image();
            image.onload = () => {
                const maxSize = 1200;
                const scale = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight));
                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
                const ctx = canvas.getContext("2d");
                if (!ctx) { reject(new Error("Canvas is not available")); return; }
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL("image/jpeg", 0.76));
            };
            image.onerror = () => reject(new Error("Image load failed"));
            image.src = reader.result;
        };
        reader.onerror = () => reject(new Error("File read failed"));
        reader.readAsDataURL(file);
    });
}

function setupMainPhotos() {
    document.querySelectorAll(".main-photo-file").forEach(input => {
        input.addEventListener("change", async () => {
            const file = input.files && input.files[0];

                showToast("画像ファイルを選択してください");
                input.value = "";
                return;
            }
            const index = Number(input.dataset.photoIndex);
            try {
                const dataUrl = await resizeImageForMainPhoto(file);
                const photos = loadMainPhotos();
                photos[index] = dataUrl;
                if (!saveMainPhotos(photos)) {
                    showToast("画像を保存できませんでした");
                    return;
                }
                renderPage("dashboard");
                showToast(`写真${index + 1}を設定しました`);
            } catch (error) {
                console.log("Main photo error:", error);
                showToast("画像の設定に失敗しました");
            } finally {
                input.value = "";
            }
        });
    });

    document.querySelectorAll(".main-photo-select").forEach(button => {
        button.addEventListener("click", () => {
            const input = document.querySelector(`.main-photo-file[data-photo-index="${button.dataset.photoIndex}"]`);
            if (input) input.click();
        });
    });

    document.querySelectorAll(".main-photo-remove").forEach(button => {
        button.addEventListener("click", () => {

        });
    });
}

const MENU_FONT_STORAGE_KEY = "modmenu_custom_font_v1";
let menuFontObjectUrl = null;

function applyMenuFont(dataUrl, fileName = "") {
    let style = document.getElementById("customMenuFontStyle");
    if (!style) {
        style = document.createElement("style");
        style.id = "customMenuFontStyle";
        document.head.appendChild(style);
    }
    if (!dataUrl) {
        style.textContent = "";
        if (menuFontObjectUrl) {
            URL.revokeObjectURL(menuFontObjectUrl);
            menuFontObjectUrl = null;
        }
        const name = document.getElementById("menuFontName");
        if (name) name.textContent = "標準フォント";
        return;
    }
    const match = dataUrl.match(/^data:([^;,]+);base64,(.+)$/);
    if (!match) return;
    const format = match[1].toLowerCase();
    const mime = format === "font/woff2" ? "woff2" :
        format === "font/woff" ? "woff" :
        format === "font/otf" || format === "application/vnd.ms-opentype" ? "opentype" : "truetype";
    style.textContent = `@font-face{font-family:"UploadedMenuFont";src:url("${dataUrl}") format("${mime}");font-display:swap}
        body,body *{font-family:"UploadedMenuFont",sans-serif !important}`;
    const name = document.getElementById("menuFontName");
    if (name) name.textContent = fileName || "カスタムフォント";
}

function loadMenuFont() {
    try {
        const saved = localStorage.getItem(MENU_FONT_STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.dataUrl) applyMenuFont(parsed.dataUrl, parsed.name || "");
        }
    } catch (error) {
        console.log("Menu font load error:", error);
    }
}

        const LOCAL_DRAFT_KEY = "AliciaXver4.7_htmlAnalysisDraft_v1";
        let localSaveTimer = null;
        const setStatus = (message) => { if (status) status.textContent = message; };
        const saveLocalDraft = (announce = false) => {
            try {
                localStorage.setItem(LOCAL_DRAFT_KEY, JSON.stringify({
                    url: urlInput?.value || "",
                    source: sourceArea?.value || "",
                    savedAt: new Date().toISOString()
                }));
                if (announce) setStatus("URLとHTML内容をこのブラウザのローカルストレージに保存しました。");
                return true;
            } catch (error) {
                console.warn("HTMLAnalysis local save failed:", error);
                if (announce) setStatus("ローカル保存できませんでした。内容が大きすぎるか、ブラウザの保存領域が利用できない可能性があります。");
                return false;
            }
        };
        const scheduleLocalSave = () => {
            if (localSaveTimer) clearTimeout(localSaveTimer);
            localSaveTimer = setTimeout(() => saveLocalDraft(false), 400);
        };
        try {
            const savedDraft = JSON.parse(localStorage.getItem(LOCAL_DRAFT_KEY) || "null");
            if (savedDraft && typeof savedDraft === "object") {
                if (urlInput) urlInput.value = typeof savedDraft.url === "string" ? savedDraft.url : "";
                if (sourceArea) sourceArea.value = typeof savedDraft.source === "string" ? savedDraft.source : "";
                if (savedDraft.url || savedDraft.source) setStatus("前回のURLとHTML内容をローカル保存から復元しました。編集内容は自動保存されます。");
            }
        } catch (error) { console.warn("HTMLAnalysis local restore failed:", error); }
        urlInput?.addEventListener("input", scheduleLocalSave);
        sourceArea?.addEventListener("input", scheduleLocalSave);
        document.getElementById("analysisLocalSave")?.addEventListener("click", () => saveLocalDraft(true));
        window.addEventListener("pagehide", () => saveLocalDraft(false));
        const getFilename = () => {
            try {
                const u = new URL(urlInput.value.trim());
                let name = u.hostname + (u.pathname && u.pathname !== "/" ? u.pathname.replace(/\/$/, "") : "");
                name = name.split("/").filter(Boolean).pop() || u.hostname;
                name = name.replace(/[^a-z0-9._-]/gi, "_").replace(/\.(html?|php|aspx?)$/i, "") || "webpage";
                return name + ".html";
            } catch (_) { return "webpage.html"; }
        };
        fetchButton?.addEventListener("click", async () => {
            const raw = (urlInput?.value || "").trim();
            if (!raw) { setStatus("先にWeb URLを入力してください。"); return; }
            let target;
            try { target = new URL(raw); } catch (_) { setStatus("URLの形式を確認してください。"); return; }
            if (!/^https?:$/.test(target.protocol)) { setStatus("http:// または https:// のURLを入力してください。"); return; }
            fetchButton.disabled = true;
            fetchButton.textContent = "取得中…";
            setStatus("ページのHTMLを取得しています…");
            try {
                const response = await fetch(target.href, { method: "GET", mode: "cors", credentials: "omit" });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const source = await response.text();
                sourceArea.value = source;
                saveLocalDraft(false);
                setStatus(`取得完了：${source.length.toLocaleString()} 文字。ローカル保存しました。HTMLを書き出せます。`);
            } catch (error) {
                setStatus("取得できませんでした。対象サイトがブラウザからの取得（CORS）を許可していない可能性があります。ブラウザでページのソースを表示してコピーするか、HTMLファイルを読み込んでください。詳細：" + (error?.message || "取得エラー"));
            } finally {
                fetchButton.disabled = false;
                fetchButton.textContent = "URLからHTML取得";
            }
        });
        document.getElementById("analysisFile")?.addEventListener("change", async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
                sourceArea.value = await file.text();
                saveLocalDraft(false);
                setStatus(`ファイル読込完了：${file.name}（${sourceArea.value.length.toLocaleString()} 文字）。ローカル保存しました。`);
                if (urlInput && !urlInput.value) urlInput.value = "";
            } catch (_) { setStatus("ファイルを読み込めませんでした。"); }
            event.target.value = "";
        });
        document.getElementById("analysisDownload")?.addEventListener("click", () => {
            const source = sourceArea?.value || "";
            if (!source.trim()) { setStatus("書き出すHTMLがありません。"); return; }
            const blob = new Blob([source], { type: "text/html;charset=utf-8" });
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = objectUrl;
            link.download = getFilename();
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            setStatus("HTMLファイルを書き出しました。");
        });
        document.getElementById("analysisCopy")?.addEventListener("click", async () => {
            const source = sourceArea?.value || "";

                setStatus(copied ? "HTMLソースをコピーしました。" : "コピーできませんでした。欄内を選択して手動でコピーしてください。");
            }
        });
        document.getElementById("analysisClear")?.addEventListener("click", () => {
            if (urlInput) urlInput.value = "";

            setStatus("入力欄をクリアし、空の内容をローカル保存しました。");

function setupSkinItemBuilder() {
    const form = document.getElementById("skinItemForm");
    const preview = document.getElementById("skinItemPreview");
    const copyButton = document.getElementById("skinItemCopy");
    const downloadButton = document.getElementById("skinItemDownload");
    const searchInput = document.getElementById("skinItemSearch");
    if (!form || !preview) return;

    const valueOf = (item) => typeof item === "string" ? item : (item && item.id ? item.id : "");
    const nameOf = (item) => typeof item === "string" ? item : ((item && (item.name || item.title)) || valueOf(item));
    const skinEntries = skinList.map(item => ({ id: valueOf(item), name: nameOf(item) })).filter(x => x.id);
    const itemEntries = itemList.map(item => ({ id: valueOf(item), name: nameOf(item) })).filter(x => x.id);

    const escape = (v) => escapeHTML(String(v));
    const makeOptions = (entries) => {
        const seen = new Set();
        const options = [`<option value="">（空）</option>`];
        entries.forEach(({id,name}) => {
            if (seen.has(id)) return;
            seen.add(id);
            const label = name && name !== id ? `${name} — ${id}` : id;
            options.push(`<option value="${escapeAttribute(id)}" data-name="${escape(name)}">${escape(label)}</option>`);
        });
        return options.join("");
    };

    function fillSelect(select, entries) {
        const current = select.value;
        select.innerHTML = makeOptions(entries);
        if ([...select.options].some(o => o.value === current)) select.value = current;
    }

    const allSelects = () => form.querySelectorAll(".skinitem-field, .skinitem-array-select");

    // 検索で現在選択中の項目が候補から一時的に外れても、選択値を失わないように保持する。
    // <select>.value だけに依存すると、filter後にoptionが存在しなくなった瞬間にvalueが空になってしまう。
    const rememberedValues = new WeakMap();
    const SKINITEM_STORAGE_KEY = "codeListSkinItemSelections";
    let storedSkinItemState = { fields: {}, arrays: {} };
    try {
        const saved = JSON.parse(localStorage.getItem(SKINITEM_STORAGE_KEY) || "null");
        if (saved && typeof saved === "object") {
            storedSkinItemState = {
                fields: saved.fields && typeof saved.fields === "object" ? saved.fields : {},
                arrays: saved.arrays && typeof saved.arrays === "object" ? saved.arrays : {}
            };
        }
    } catch (e) {}

    const saveSkinItemState = () => {
        try {
            const fields = {};
            form.querySelectorAll(".skinitem-field").forEach(select => {
                if (select.dataset.key) fields[select.dataset.key] = select.value;
            });
            const arrays = {};
            form.querySelectorAll(".skinitem-array").forEach(wrap => {
                const key = wrap.dataset.array;
                if (key) arrays[key] = Array.from(wrap.querySelectorAll(".skinitem-array-select"))
                    .map(select => select.value).filter(Boolean);
            });
            storedSkinItemState = { fields, arrays };
            localStorage.setItem(SKINITEM_STORAGE_KEY, JSON.stringify(storedSkinItemState));
        } catch (e) {}
    };

    const rememberSelectValue = (select) => {
        rememberedValues.set(select, select.value);
    };
    const getRememberedValue = (select) => {
        return rememberedValues.has(select) ? rememberedValues.get(select) : select.value;
    };

    const filterSelect = (select, entries, query) => {
        const current = getRememberedValue(select);
        const q = query.trim().toLowerCase();
        let filtered = !q ? entries : entries.filter(x => `${x.name} ${x.id}`.toLowerCase().includes(q));

        // 選択中の値が検索条件に一致しなくても候補から除外しない。
        // これにより検索のたびに選択値が「（空）」へ戻ることを防ぐ。
        if (current && !filtered.some(x => x.id === current)) {
            const selectedEntry = entries.find(x => x.id === current);
            if (selectedEntry) filtered = [selectedEntry, ...filtered];
        }

        select.innerHTML = makeOptions(filtered);
        if ([...select.options].some(o => o.value === current)) {
            select.value = current;
        }
    };

    form.querySelectorAll(".skinitem-field").forEach(select => {
        const source = select.dataset.source === "skin" ? skinEntries : itemEntries;
        fillSelect(select, source);
        const savedValue = storedSkinItemState.fields[select.dataset.key];
        if (savedValue !== undefined && [...select.options].some(o => o.value === savedValue)) {
            select.value = savedValue;
        }
        rememberSelectValue(select);
        select.addEventListener("change", () => {
            saveSkinItemState();
            rememberSelectValue(select);
            updatePreview();
        });
    });

    const arrays = {
        EmoteIdList: ["Em_0901_WatermelonTransformation","Em_1401_RabitTransformation","Em_0007_Groundfat"],
        WeaponSkinIds: ["Ch_2601_SwimsuitLiz","Ch_6642_ArabianHiro","Ch_5436_BoxcelJapapa"],
        SupportSkinIds: ["Ch_5149_MiniEliteSky"]
    };

    const sourceFor = key => key === "WeaponSkinIds" || key === "SupportSkinIds" ? skinEntries : itemEntries;
    const noAddRemove = new Set(["EmoteIdList", "SupportSkinIds"]);

    const addArrayRow = (key, value = "", source) => {
        const wrap = form.querySelector(`[data-array="${key}"]`);
        if (!wrap) return;
        const row = document.createElement("div");
        row.className = "skinitem-array-row";
        const select = document.createElement("select");
        select.className = "skinitem-select skinitem-array-select";
        select.dataset.arrayKey = key;
        select.innerHTML = makeOptions(source);
        select.value = value;
        rememberSelectValue(select);
        select.addEventListener("change", () => {
            rememberSelectValue(select);
            saveSkinItemState();
            updatePreview();
        });
        row.append(select);
        if (!noAddRemove.has(key)) {
            const remove = document.createElement("button");
            remove.className = "skinitem-remove";
            remove.type = "button";
            remove.textContent = "×";
            remove.title = "削除";
            remove.addEventListener("click", () => {
                row.remove();
                if (!wrap.querySelector(".skinitem-array-row")) addArrayRow(key, "", source);
                saveSkinItemState();
                updatePreview();
            });
            row.append(remove);
        }
        // 追加ボタンが既に存在する場合は、常にボタンの直前へ挿入する。
        // これにより WeaponSkinIds を追加した行が「+ 追加」の下へ回らない。
        const addButton = wrap.querySelector(".skinitem-add");
        if (addButton) {
            wrap.insertBefore(row, addButton);
        } else {
            wrap.appendChild(row);
        }
    };

    Object.keys(arrays).forEach(key => {
        const wrap = form.querySelector(`[data-array="${key}"]`);
        if (!wrap) return;
        const savedValues = Array.isArray(storedSkinItemState.arrays[key]) ? storedSkinItemState.arrays[key] : null;
        (savedValues && savedValues.length ? savedValues : (arrays[key] || [""])).forEach(value => addArrayRow(key, value, sourceFor(key)));
        if (!noAddRemove.has(key)) {
            const add = document.createElement("button");
            add.className = "skinitem-add";
            add.type = "button";
            add.textContent = "+ 追加";
            add.addEventListener("click", () => {
                addArrayRow(key, "", sourceFor(key));
                saveSkinItemState();
            });
            wrap.appendChild(add);
        }
    });

    function buildResult() {
        const result = {};
        form.querySelectorAll(".skinitem-field").forEach(select => {
            result[select.dataset.key] = select.value;
        });
        form.querySelectorAll(".skinitem-array").forEach(wrap => {
            const key = wrap.dataset.array;
            result[key] = Array.from(wrap.querySelectorAll(".skinitem-array-select"))
                .map(select => select.value).filter(Boolean);
        });
        return result;
    }

    function buildOutput() {
        return {
            code: 200,
            status: "OK",
            data: {
                FunctionName: "UpdatePreset",
                Revision: 306,
                FunctionResult: buildResult(),
                Logs: [],
                ExecutionTimeSeconds: 0.2059016,
                ProcessorTimeSeconds: 0.005481,
                MemoryConsumedBytes: 177800,
                APIRequestsIssued: 7,
                HttpRequestsIssued: 0
            }
        };
    }

    function updatePreview() {
        preview.textContent = JSON.stringify(buildOutput(), null, 2);
    }

    if (searchInput) {
        searchInput.addEventListener("input", () => {
            const q = searchInput.value;
            form.querySelectorAll(".skinitem-field").forEach(select => {
                filterSelect(select, select.dataset.source === "skin" ? skinEntries : itemEntries, q);
            });
            form.querySelectorAll(".skinitem-array-select").forEach(select => {
                filterSelect(select, sourceFor(select.dataset.arrayKey), q);
            });
        });
    }

    if (copyButton) {
        copyButton.addEventListener("click", async () => {
            const text = preview.textContent || "{}";
            try {
                await navigator.clipboard.writeText(text);
                showToast("SKIN/ITEMコードをコピーしました");
            } catch {
                const area = document.createElement("textarea");
                area.value = text; document.body.appendChild(area); area.select();
                document.execCommand("copy"); area.remove();
                showToast("SKIN/ITEMコードをコピーしました");
            }
        });
    }

    if (downloadButton) {
        downloadButton.addEventListener("click", () => {
            const blob = new Blob([preview.textContent || "{}"], {type: "application/json;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "UpdatePreset.json";
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            showToast("UpdatePreset.jsonをダウンロードしました");
        });
    }

    updatePreview();
}

function renderCodeList() {
    const card = document.getElementById("codeListCard");
    if (!card) return;

    if (!codeList.length) {
        card.innerHTML = `<div class="code-empty">保存されたコードはまだありません</div>`;
        return;
    }

    card.innerHTML = codeList.map((item, index) => {
        const hasMore = item.code.split("\n").length > 5;
        return `
        <div class="code-entry" data-code-index="${index}">
            <div class="code-entry-head">
                <div class="code-entry-title">${escapeHTML(item.title)}</div>
                <div class="code-entry-actions">
                    <button class="code-move code-move-up" type="button" aria-label="上へ移動" title="上へ">↑</button>
                    <button class="code-move code-move-down" type="button" aria-label="下へ移動" title="下へ">↓</button>
                    <button class="code-action code-download" type="button" aria-label="コードをダウンロード" title="ダウンロード">⇩</button>
                    <button class="code-action code-delete" type="button" aria-label="コードを削除" title="削除">🗑</button>
                    ${hasMore ? '<button class="code-toggle" type="button" aria-label="コードを展開" title="展開">v</button>' : ''}
                </div>
            </div>
            <div class="code-body">
                <pre class="code-text">${escapeHTML(item.code)}</pre>
            </div>
        </div>
    `;
    }).join("");

    const moveCodeEntry = (index, direction) => {
        const target = index + direction;
        if (index < 0 || target < 0 || target >= codeList.length) return;
        [codeList[index], codeList[target]] = [codeList[target], codeList[index]];
        saveCodeList();
        renderCodeList();
    };

    card.querySelectorAll(".code-move-up").forEach(button => {
        button.addEventListener("click", event => {
            event.stopPropagation();
            const entry = button.closest(".code-entry");
            moveCodeEntry(Number(entry.dataset.codeIndex), -1);
        });
    });

    card.querySelectorAll(".code-move-down").forEach(button => {
        button.addEventListener("click", event => {
            event.stopPropagation();
            const entry = button.closest(".code-entry");
            moveCodeEntry(Number(entry.dataset.codeIndex), 1);
        });
    });

    card.querySelectorAll(".code-toggle").forEach(button => {
        button.addEventListener("click", event => {
            event.stopPropagation();
            const entry = button.closest(".code-entry");
            const expanded = entry.classList.toggle("expanded");
            button.setAttribute("aria-label", expanded ? "コードを折りたたむ" : "コードを展開");
            button.setAttribute("title", expanded ? "折りたたむ" : "展開");
        });
    });

    card.querySelectorAll(".code-delete").forEach(button => {
        button.addEventListener("click", event => {
            event.stopPropagation();
            const entry = button.closest(".code-entry");
            const index = Number(entry.dataset.codeIndex);
            if (!Number.isInteger(index) || !codeList[index]) return;
            const title = codeList[index].title;
            if (!confirm(`「${title}」を削除しますか？`)) return;
            codeList.splice(index, 1);
            saveCodeList();
            renderCodeList();
            showToast("コードを削除しました");
        });
    });

    card.querySelectorAll(".code-download").forEach(button => {
        button.addEventListener("click", event => {
            event.stopPropagation();
            const entry = button.closest(".code-entry");
            const index = Number(entry.dataset.codeIndex);
            const item = codeList[index];
            if (!item) return;

            const blob = new Blob([item.code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            const safeTitle = item.title.replace(/[\\/:*?"<>|]/g, "_").trim() || "code";
            anchor.href = url;
            anchor.download = `${safeTitle}.txt`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast("コードをダウンロードしました");
        });
    });
}

function formatHistoryTime(timestamp) {
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString("ja-JP", {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
}

const UI_OPACITY_STORAGE_KEY = "modmenu_ui_opacity_v1";
const DEFAULT_UI_OPACITY = 10;

function loadUIOpacity() {
    try {
        const saved = Number(localStorage.getItem(UI_OPACITY_STORAGE_KEY));
        if (!Number.isFinite(saved)) return DEFAULT_UI_OPACITY;
        return Math.min(10, Math.max(0, Math.round(saved)));
    } catch (error) {
        console.log("UI opacity load error:", error);
        return DEFAULT_UI_OPACITY;
    }
}

function saveUIOpacity(value) {
    const opacity = Math.min(10, Math.max(0, Math.round(Number(value) || 0)));
    try {
        localStorage.setItem(UI_OPACITY_STORAGE_KEY, String(opacity));
    } catch (error) {
        console.log("UI opacity save error:", error);
    }
    return opacity;
}

function applyUIOpacity() {
    const opacity = loadUIOpacity();
    document.documentElement.style.setProperty("--ui-opacity", String(opacity / 10));
}

const THEME_STORAGE_KEY = "modmenu_theme_v1";

function normalizeTheme(theme) {
    const value = String(theme || "Black");
    const allowed = ["Black", "Red", "Green", "Pink", "Blue", "Purple", "White", "Orange", "Yellow", "YellowGreen"];
    return allowed.includes(value) ? value : "Black";
}

function applyTheme(theme = localStorage.getItem(THEME_STORAGE_KEY)) {
    const selected = normalizeTheme(theme);
    document.body.classList.remove(
        "theme-red", "theme-green", "theme-pink", "theme-blue",
        "theme-purple", "theme-white", "theme-black", "theme-orange", "theme-yellow", "theme-yellowgreen",
        "theme-dark", "theme-darker"
    );

    const classMap = {
        Black: "theme-black",
        Red: "theme-red",
        Green: "theme-green",
        Pink: "theme-pink",
        Blue: "theme-blue",
        Purple: "theme-purple",
        White: "theme-white",
        Orange: "theme-orange",
        Yellow: "theme-yellow",
        YellowGreen: "theme-yellowgreen"
    };

    document.body.classList.add(classMap[selected]);
    try {
        localStorage.setItem(THEME_STORAGE_KEY, selected);
    } catch (error) {
        console.log("Theme save error:", error);
    }
    return selected;
}

function setupThemeControl() {

function createSetting(setting) {

    let control = "";


    if (
        setting.type ===
        "toggle"
    ) {

        const saved =
            setting.storageKey
                ? localStorage.getItem(
                    setting.storageKey
                )
                : null;


        const active =
            saved === "true";


        control = `

            <div
                class="toggle ${
                    active
                    ? "active"
                    : ""
                }"

                role="switch"

                aria-checked="${active}"

                ${
                    setting.storageKey
                    ? `data-storage="${escapeAttribute(
                        setting.storageKey
                    )}"`
                    : ""
                }

            ></div>

        `;

    }


    else if (
        setting.type ===
        "slider"
    ) {

        control = `

            <div
                class="slider-container"
            >

                <input
                    type="range"
                    min="${setting.min}"
                    max="${setting.max}"
                    value="${setting.value}"
                >


                <span
                    class="slider-value"
                >
                    ${setting.value}
                </span>

            </div>

        `;

    }


    else if (
        setting.type ===
        "select"
    ) {

        control = `

            <select ${setting.name === "Theme" ? 'id="themeSelect"' : ""}>

                ${
                    setting.options
                        .map(option => `

                            <option>
                                ${escapeHTML(
                                    option
                                )}
                            </option>

                        `)
                        .join("")
                }

            </select>

        `;

    }


    else if (setting.type === "uiOpacity") {
        const opacity = loadUIOpacity();
        control = `
            <div class="background-darkness-control">
                <input id="uiOpacityInput" type="range" min="0" max="10" step="1" value="${opacity}" aria-label="UIの透明度">
                <span class="background-darkness-value" id="uiOpacityValue">${opacity}</span>
            </div>
        `;
    }

    else if (setting.type === "font") {
        let savedFontName = "標準フォント";
        try {
            const savedFont = JSON.parse(localStorage.getItem(MENU_FONT_STORAGE_KEY) || "null");
            if (savedFont && savedFont.name) savedFontName = savedFont.name;
        } catch (error) {}
        control = `
            <div class="font-setting-controls">
                <input class="font-file-input" id="menuFontInput" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2">
                <span class="font-setting-name" id="menuFontName">${escapeHTML(savedFontName)}</span>
                <button class="font-setting-button" id="menuFontChoose" type="button">ファイル選択</button>
                <button class="font-setting-button" id="menuFontReset" type="button">リセット</button>
            </div>
        `;
    }

    else if (setting.type === "background") {
        control = `
            <div>
                <input class="background-file-input" id="backgroundImageInput" type="file" accept="image/*">
                <button class="background-setting-button" id="backgroundImageButton" type="button">写真を選択</button>
            </div>
        `;
    }

    else if (setting.type === "backgroundDarkness") {
        const darkness = loadBackgroundDarkness();
        control = `
            <div class="background-darkness-control">
                <input id="backgroundDarknessInput" type="range" min="0" max="10" step="1" value="${darkness}" aria-label="背景の暗さ">
                <span class="background-darkness-value" id="backgroundDarknessValue">${darkness}</span>
            </div>
        `;
    }

    else if (setting.type === "backgroundReset") {
        control = `
            <button class="background-setting-button" id="backgroundResetButton" type="button">黒背景に戻す</button>
        `;
    }



    else if (
        setting.type ===
        "button"
    ) {

        control = `

            <button
                class="action-button"
            >
                ${escapeHTML(
                    setting.text ||
                    "Execute"
                )}
            </button>

        `;

    }


    return `

        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    ${escapeHTML(
                        setting.name
                    )}
                </div>


                <div
                    class="setting-description"
                >
                    ${escapeHTML(
                        setting.description ||
                        ""
                    )}
                </div>

            </div>


            ${control}

        </div>

    `;

}

function setupDataManagement() {
    const head = document.getElementById("dataManagementHead");
    const body = document.getElementById("dataManagementBody");
    if (!head || !body) return;

    head.addEventListener("click", () => {
        const open = body.classList.toggle("open");
        head.classList.toggle("open", open);
        head.setAttribute("aria-expanded", open);
    });

    body.querySelectorAll("[data-add-type]").forEach(action => {
        action.addEventListener("click", () => {
            const type = action.dataset.addType;
            body.querySelectorAll(".data-add-form").forEach(form => form.classList.remove("open"));
            const form = body.querySelector(`[data-form-type="${type}"]`);
            if (form) {
                form.classList.add("open");
                const first = form.querySelector("input");
                if (first) setTimeout(() => first.focus(), 0);
            }
        });
    });

    body.querySelectorAll(".data-add-cancel").forEach(button => {
        button.addEventListener("click", () => {
            const form = button.closest(".data-add-form");
            if (!form) return;
            form.classList.remove("open");
            form.querySelectorAll("input").forEach(input => input.value = "");
        });
    });

    body.querySelectorAll(".data-add-button").forEach(button => {
        button.addEventListener("click", () => {
            const form = button.closest(".data-add-form");
            if (!form) return;
            const type = form.dataset.formType;
            const get = field => {
                const input = form.querySelector(`[data-field="${field}"]`);
                return input ? input.value : "";
            };

            let success = false;
            if (type === "playerID") {
                const id = get("id");
                if (!id.trim()) { showToast("PlayerIDを入力してください"); return; }
                success = addCustomPlayerID(id, get("name"), get("no"));
            } else if (type === "playerName") {
                const name = get("name");
                if (!name.trim()) { showToast("PlayerNameを入力してください"); return; }
                success = addCustomPlayerName(name);
            } else if (type === "skinID") {
                const id = get("id");
                if (!id.trim()) { showToast("SkinIDを入力してください"); return; }
                success = addCustomPair("SkinID", id, get("name"));
            } else if (type === "itemID") {
                const id = get("id");
                if (!id.trim()) { showToast("ItemIDを入力してください"); return; }
                success = addCustomPair("ItemID", id, get("name"));
            }

            if (!success) {
                showToast("同じIDまたは名前が既に登録されています");
                return;
            }

            form.querySelectorAll("input").forEach(input => input.value = "");
            form.classList.remove("open");
            showToast("追加しました");

            if (currentPage === "dashboard") renderPage("dashboard");
            else if (currentPage === "playerid") renderIDList();
            else if (currentPage === "playername") renderPlayerList();
            else if (currentPage === "skinid") renderSkinList();
            else if (currentPage === "itemid") renderItemList();
        });
    });
}

const MENU_ICON_PREFIX = "menuIcon_";
function loadMenuIcon(page){try{const saved=localStorage.getItem(MENU_ICON_PREFIX+page);if(saved)return saved;if(page==="analysis")return localStorage.getItem(MENU_ICON_PREFIX+"test")||"";return "";}catch(e){return "";}}
function saveMenuIcon(page,dataUrl){try{localStorage.setItem(MENU_ICON_PREFIX+page,dataUrl);return true;}catch(e){console.log("Menu icon save error:",e);return false;}}
function clearMenuIcon(page){try{localStorage.removeItem(MENU_ICON_PREFIX+page);}catch(e){}}
function applyMenuIcons(){document.querySelectorAll("[data-icon-page]").forEach(icon=>{const u=loadMenuIcon(icon.dataset.iconPage);icon.style.backgroundImage=u?`url("${u}")`:"";});}
function resizeMenuIcon(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const size=96,c=document.createElement("canvas");c.width=size;c.height=size;const x=c.getContext("2d"),scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(size-w)/2,(size-h)/2,w,h);resolve(c.toDataURL("image/jpeg",.78));};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}
function setupMenuIconControls(){document.querySelectorAll("[data-menu-icon-input]").forEach(input=>{input.addEventListener("change",async()=>{const page=input.dataset.menuIconInput,file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith("image/")){showToast("画像ファイルを選択してください");input.value="";return;}try{const u=await resizeMenuIcon(file);if(!saveMenuIcon(page,u)){showToast("アイコンを保存できませんでした");return;}const preview=document.querySelector(`[data-menu-icon-preview="${page}"]`);if(preview)preview.src=u;applyMenuIcons();if(page==="namebutton")applyNameButtonIcon();showToast("メニューアイコンを設定しました");}catch(e){console.log("Menu icon error:",e);showToast("アイコンの設定に失敗しました");}finally{input.value="";}});});document.querySelectorAll("[data-menu-icon-reset]").forEach(btn=>{btn.addEventListener("click",()=>{const page=btn.dataset.menuIconReset;clearMenuIcon(page);const preview=document.querySelector(`[data-menu-icon-preview="${page}"]`);if(preview)preview.removeAttribute("src");applyMenuIcons();if(page==="namebutton")applyNameButtonIcon();showToast("メニューアイコンをリセットしました");});});}
function setupSidebarToggle(){const toggle=document.getElementById("sidebarToggle");if(!toggle||toggle.dataset.bound)return;toggle.dataset.bound="true";const enabled=localStorage.getItem("sidebarCollapseEnabled")!=="false";toggle.style.display=enabled?"flex":"none";const collapsed=localStorage.getItem("sidebarCollapsed")==="true";document.body.classList.toggle("sidebar-collapsed",enabled&&collapsed);toggle.setAttribute("aria-expanded",String(!(enabled&&collapsed)));toggle.title=enabled&&collapsed?"サイドバーを開く":"サイドバーを折りたたむ";toggle.addEventListener("click",()=>{if(localStorage.getItem("sidebarCollapseEnabled")==="false")return;const c=document.body.classList.toggle("sidebar-collapsed");localStorage.setItem("sidebarCollapsed",String(c));toggle.setAttribute("aria-expanded",String(!c));toggle.title=c?"サイドバーを開く":"サイドバーを折りたたむ";});}
function applySidebarCollapseSetting(){const t=document.getElementById("sidebarToggle");if(!t)return;const e=localStorage.getItem("sidebarCollapseEnabled")!=="false";t.style.display=e?"flex":"none";if(!e)document.body.classList.remove("sidebar-collapsed");}

async function copyText(text, historyName = "", historyType = "ID", recordHistory = true) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator
                .clipboard
                .writeText(text);

            if (recordHistory) addHistory(text, historyName, historyType);
            return true;

        }

    }
    catch (error) {

        console.log(
            "Clipboard API failed:",
            error
        );

    }


    try {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.left =
            "-9999px";


        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        const result =
            document.execCommand(
                "copy"
            );


        textarea.remove();

        if (result && recordHistory) addHistory(text, historyName, historyType);

        return result;

    }
    catch (error) {

        console.log(
            "Fallback copy failed:",
            error
        );


        return false;

    }

}

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value);

}

<script>
/* Auth gate for GitHub Pages. This is a client-side convenience gate, not strong content protection. */
(() => {
  "use strict";
  const EXPECTED_SHA256 = "618d044c54b1e259babb2767cb690f98b507a018e9b3a35b73ef08eba2cfe7a9";
  const STORAGE_KEY = "alicia_auth_session_v1";
  const gate = document.getElementById("authGate");
  const form = document.getElementById("authForm");
  const fileInput = document.getElementById("authKeyFile");
  const submit = document.getElementById("authSubmit");
  const message = document.getElementById("authMessage");

  try {
    if (localStorage.getItem(STORAGE_KEY) === "ok") {
      document.body.classList.add("auth-ok");
    }
  } catch (_) {}

  async function sha256(text) {
    const bytes = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, "0")).join("");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "";
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      message.textContent = "認証キーファイルを選択してください。";
      return;
    }
    submit.disabled = true;
    submit.textContent = "確認中…";
    try {
      const keyText = (await file.text()).trim();
      const digest = await sha256(keyText);
      if (digest !== EXPECTED_SHA256) {
        message.textContent = "認証に失敗しました。配布されたファイルを確認してください。";
        return;
      }
      try { localStorage.setItem(STORAGE_KEY, "ok"); } catch (_) {}
      document.body.classList.add("auth-ok");
    } catch (error) {
      message.textContent = "ファイルを読み込めませんでした。もう一度お試しください。";
    } finally {
      submit.disabled = false;
      submit.textContent = "ログイン";
    }
  });
})();
</script>
